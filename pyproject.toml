[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cringe-filter"
dynamic = ["version"]
description = "Strip AI tells from prose: a linter, scorer and prompt builder measured on 1.9M words of human vs. Claude writing"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sterling Baird"}]
keywords = ["ai-slop", "llm", "writing", "linter", "claude", "stylometry", "claude-code-skill"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
rewrite = ["anthropic>=0.40"]
mcp = ["mcp>=2.2,<3"]
test = ["pytest", "mcp>=2.2,<3; python_version >= '3.10'"]
docs = ["sphinx>=7", "myst-parser>=3", "furo"]

[project.urls]
Homepage = "https://github.com/sgbaird/cringe-filter"
Documentation = "https://cringe-filter.readthedocs.io"
Issues = "https://github.com/sgbaird/cringe-filter/issues"

[project.scripts]
cringe-filter = "cringe_filter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cringe_filter*"]

[tool.setuptools.package-data]
cringe_filter = ["data/*.json", "data/exemplars/*.md"]

[tool.setuptools.dynamic]
version = {attr = "cringe_filter.__version__"}
